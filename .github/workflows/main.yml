
name: Build Small Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore MySwitcher.csproj

      - name: Publish Small EXE
        run: |
          dotnet publish MySwitcher.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AppSwitcher-Small-Windows
          path: publish/AppSwitcher.exe
          if-no-files-found: error
